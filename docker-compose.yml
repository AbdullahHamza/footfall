services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: footfall
      POSTGRES_PASSWORD: footfall
      POSTGRES_DB: footfall
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footfall"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://footfall:footfall@db:5432/footfall
      OFFICE_CAPACITY: "500"
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
